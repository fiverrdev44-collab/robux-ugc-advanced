name: Phase 2 PostgreSQL Integration

on:
  push:
    branches:
      - feat/phase2-market-intelligence
  pull_request:
    branches:
      - main

jobs:
  phase2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vanta_test
      PHASE2_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests
      - name: Run Phase 2 PostgreSQL integration
        run: python test_phase2_pg_integration.py
