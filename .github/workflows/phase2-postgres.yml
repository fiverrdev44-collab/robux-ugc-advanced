name: Phase 2 PostgreSQL Integration

on:
  push:
    branches:
      - feat/phase2-market-intelligence
      - fix/phase2-m2-data-coverage
      - feat/phase2-m3-opportunity-validation
      - fix/convergence-budget-integrity
      - feat/phase2-m4-original-ugc
      - fix/m6a-security-authorization
      - audit/final-vanta73-certification
      - fix/f05-unified-roblox-api-safety
      - fix/f07-f08-creator-identity-integrity
      - fix/f09-oracle-rate-limit-recovery
      - fix/f10-timestamp-integrity
      - fix/f18-sales-source-authentication
      - release/vanta73-final-certification-rc
      - release/vanta73-operational-gate
  pull_request:
    branches:
      - main

jobs:
  phase2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PHASE2_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vanta_test
      PHASE2_TEST_DB_CONFIRM: disposable
      PHASE2_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests aiohttp
      - name: Run Phase 2 PostgreSQL integration
        shell: bash
        run: |
          set +e
          python test_phase2_pg_integration.py 2>&1 | tee pg-integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 pg-integration.log | while IFS= read -r line; do
              echo "::error title=PG integration failure::$line"
            done
          fi
          exit "$status"
      - name: Run F-07/F-08 creator identity PostgreSQL migrations
        shell: bash
        run: |
          set +e
          python test_f07_f08_creator_identity_pg.py 2>&1 | tee f07-f08-pg.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 f07-f08-pg.log | while IFS= read -r line; do
              echo "::error title=F-07/F-08 PG failure::$line"
            done
          fi
          exit "$status"
      - name: Run F-09 ORACLE recovery PostgreSQL persistence
        shell: bash
        run: |
          set +e
          python test_f09_oracle_recovery_pg.py 2>&1 | tee f09-oracle-pg.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 f09-oracle-pg.log | while IFS= read -r line; do
              echo "::error title=F-09 ORACLE PG failure::$line"
            done
          fi
          exit "$status"
      - name: Run F-10 timestamp integrity PostgreSQL migration
        shell: bash
        run: |
          set +e
          python test_f10_timestamp_integrity_pg.py 2>&1 | tee f10-timestamp-pg.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 f10-timestamp-pg.log | while IFS= read -r line; do
              echo "::error title=F-10 timestamp PG failure::$line"
            done
          fi
          exit "$status"
      - name: Run ordered release migration manifest
        shell: bash
        run: |
          set +e
          python test_release_migration_manifest_pg.py 2>&1 | tee release-manifest-pg.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 160 release-manifest-pg.log | while IFS= read -r line; do
              echo "::error title=Release migration manifest failure::$line"
            done
          fi
          exit "$status"
      - name: Run operational gate preflight PostgreSQL checks
        shell: bash
        run: |
          set +e
          python test_operational_gate_preflight_pg.py 2>&1 | tee operational-preflight-pg.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 160 operational-preflight-pg.log | while IFS= read -r line; do
              echo "::error title=Operational preflight failure::$line"
            done
          fi
          exit "$status"
