name: Phase 2 PostgreSQL Integration

on:
  push:
    branches:
      - feat/phase2-market-intelligence
      - fix/phase2-m2-data-coverage
      - feat/phase2-m3-opportunity-validation
      - fix/convergence-budget-integrity
      - feat/phase2-m4-original-ugc
      - fix/m6a-security-authorization
  pull_request:
    branches:
      - main

jobs:
  phase2-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PHASE2_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vanta_test
      PHASE2_TEST_DB_CONFIRM: disposable
      PHASE2_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary requests aiohttp
      - name: Run Phase 2 PostgreSQL integration
        shell: bash
        run: |
          set +e
          python test_phase2_pg_integration.py 2>&1 | tee pg-integration.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 120 pg-integration.log | while IFS= read -r line; do
              echo "::error title=PG integration failure::$line"
            done
          fi
          exit "$status"
