name: Survival Intelligence Tests

on:
  push:
    branches:
      - survival-intelligence
      - portfolio-change-intelligence
      - project-oracle-phase2-1
      - feat/accuracy-first-execution-policy
      - feature/emote-title-engine
      - fix/emote-title-live-defects
      - fix/emote-title-creative-quality
      - fix/emote-title-quality-calibration
      - fix/emote-title-production-acceptance
      - feat/creator-intelligence-phase1
      - feat/phase2-market-intelligence
      - fix/phase2-m2-data-coverage
      - feat/phase2-m3-opportunity-validation
      - fix/convergence-budget-integrity
      - feat/phase2-m4-original-ugc
      - fix/m6a-security-authorization
      - audit/final-vanta73-certification
      - fix/f05-unified-roblox-api-safety
      - fix/f07-f08-creator-identity-integrity
      - fix/f09-oracle-rate-limit-recovery
      - fix/f10-timestamp-integrity
      - fix/f18-sales-source-authentication
      - release/vanta73-final-certification-rc
      - feat/vanta-conversation-v2
      - fix/backgrounds-scene-marketplace-evidence
      - fix/background-chain-report-evidence
      - fix/background-converge-data-sparse-leads
      - feat/background-visual-intelligence-v1
      - feat/background-creator-essentials-20261113
      - feat/background-multipass-creative-director
      - fix/vanta-v2-precise-sales-and-capabilities
      - release/vanta73-unified-final-rc
      - feat/backgrounds-92-rc-integration
  pull_request:
    branches:
      - main

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Project ORACLE regressions
        run: |
          python test_project_oracle.py
          python tests/test_oracle_worker.py
      - name: Run portfolio change watcher regressions
        run: |
          python test_rename_watcher.py
          python test_rename_tracking.py
      - name: Run survival intelligence regression tests
        run: python test_survival_intelligence.py
      - name: Run JARVIS and interpretation regressions
        run: python test_jarvis_cases.py
      - name: Run shared engine regressions
        run: python test_shared_repairs.py
      - name: Verify revival chain report renders without missing local context
        run: python test_chain_revive_formatter.py
      - name: Run convergence (hybrid) regressions
        run: python test_convergence_live.py
      - name: Run execution policy regressions
        run: python test_execution_policy.py
      - name: Run command cancellation integration tests
        run: python test_command_cancellation.py
      - name: Run M6-A command security regressions
        run: python test_m6a_security.py
      - name: Run Vanta conversation routing regressions
        run: python test_vanta_conversation.py
      - name: Verify explicit item-target conversation contracts
        run: python test_vanta_intent_contract.py
      - name: Verify conversational proposed-title criticism
        run: python test_natural_title_feedback.py
      - name: Evaluate VANTA Conversation 2.0 (500 dialogues)
        run: python test_vanta_conversation_v2.py
      - name: Verify exact natural-language sales/capability intents
        run: python test_vanta_exact_intents.py
      - name: Run emote title engine regressions
        run: python test_emote_title.py
      - name: Run emote quality evaluation set
        run: python test_emote_quality_set.py
      - name: Run emote held-out quality benchmark
        run: python test_emote_heldout_quality.py
      - name: Run creator intelligence Phase 1 regressions
        run: python test_creator_intelligence_phase1.py
      - name: Run Phase 2 market intelligence Milestone 1 regressions
        run: python test_phase2_milestone1.py
      - name: Run Phase 2 creator discovery Milestone 2 regressions
        run: python test_phase2_milestone2.py
      - name: Run creator identity persistence regressions
        run: python test_creator_identity_persistence.py
      - name: Run Phase 2 Milestone 3 opportunity validation regressions
        run: python test_phase2_milestone3.py
      - name: Run Phase 2 Milestone 4 original concept regressions
        run: python test_phase2_milestone4.py
      - name: Run final certification regressions
        run: python test_final_certification.py
      - name: Run final command contract regressions
        run: python test_final_command_contracts.py
      - name: Run public command callback regressions
        run: python test_public_command_callbacks.py
      - name: Run restricted command callback regressions
        run: python test_restricted_command_callbacks.py
      - name: Run Avatar Backgrounds AssetType 92 regressions
        run: python test_avatar_backgrounds.py
      - name: Verify background scenes and live marketplace category isolation
        run: python test_background_market_quality.py
      - name: Verify background convergence sparse-data recovery
        run: python test_background_converge_recovery.py
      - name: Verify background chain category-scoped evidence and scene report
        run: python test_background_chain_evidence.py
      - name: Compile background analysis modules
        run: python -m py_compile background_review.py background_intelligence.py commands_ai.py convergence_live.py
      - name: Verify visual background artwork intelligence
        run: python test_background_visual_intelligence.py
      - name: Verify background competitor and listing essentials
        run: python test_background_creator_essentials.py
      - name: Verify background evidence provenance and optional CHAIN handoff
        run: python test_background_evidence_chain_v2.py
      - name: Verify multi-pass background creative director
        run: python test_background_multi_pass.py
      - name: Verify background opportunity evidence and grounded naming
        run: python test_background_opportunities.py
      - name: Verify independent background scene and subject grounding
        run: python test_background_grounding.py
      - name: Verify cross-category creator cohort learning
        run: python test_category_creator_learning.py
      - name: Run Avatar Backgrounds routing regressions
        run: python test_background_routing_rc.py
      - name: Run F-18 sales source security regressions
        run: python test_f18_sales_source_security.py
      - name: Run F-10 timestamp integrity regressions
        run: python test_f10_timestamp_integrity.py
      - name: Run F-09 ORACLE recovery regressions
        run: python test_f09_oracle_recovery.py
      - name: Run F-07/F-08 creator identity regressions
        run: python test_f07_f08_creator_identity.py
      - name: Run F-05 unified Roblox API safety regressions
        run: python test_f05_api_safety.py
      - name: Run safe Roblox API wrapper regressions
        run: python test_safe_roblox.py
      - name: Run sales source validation regressions
        run: python test_sales_source_validation.py
      - name: Run snapshot selection regressions
        run: python test_snapshot_batch.py
      - name: Run Astra and product understanding regressions
        run: |
          python test_astra.py
          python test_product_understanding.py
      - name: Verify UGC category and identity grounding in chain pipelines
        run: python test_ugc_semantic_quality.py
      - name: Run recommendation lifecycle regressions
        run: python test_recommendation_lifecycle.py
