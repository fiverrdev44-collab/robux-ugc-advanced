name: Survival Intelligence Tests

on:
  push:
    branches:
      - survival-intelligence
      - portfolio-change-intelligence
      - project-oracle-phase2-1
      - feat/accuracy-first-execution-policy
      - feature/emote-title-engine
      - fix/emote-title-live-defects
      - fix/emote-title-creative-quality
      - fix/emote-title-quality-calibration
      - fix/emote-title-production-acceptance
      - feat/creator-intelligence-phase1
      - feat/phase2-market-intelligence
      - fix/phase2-m2-data-coverage
      - feat/phase2-m3-opportunity-validation
      - fix/convergence-budget-integrity
      - feat/phase2-m4-original-ugc
      - fix/m6a-security-authorization
      - audit/final-vanta73-certification
  pull_request:
    branches:
      - main

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Project ORACLE regressions
        run: |
          python test_project_oracle.py
          python tests/test_oracle_worker.py
      - name: Run portfolio change watcher regressions
        run: |
          python test_rename_watcher.py
          python test_rename_tracking.py
      - name: Run survival intelligence regression tests
        run: python test_survival_intelligence.py
      - name: Run JARVIS and interpretation regressions
        run: python test_jarvis_cases.py
      - name: Run shared engine regressions
        run: python test_shared_repairs.py
      - name: Run convergence (hybrid) regressions
        run: python test_convergence_live.py
      - name: Run execution policy regressions
        run: python test_execution_policy.py
      - name: Run command cancellation integration tests
        run: python test_command_cancellation.py
      - name: Run M6-A command security regressions
        run: python test_m6a_security.py
      - name: Run Vanta conversation routing regressions
        run: python test_vanta_conversation.py
      - name: Run emote title engine regressions
        run: python test_emote_title.py
      - name: Run emote quality evaluation set
        run: python test_emote_quality_set.py
      - name: Run emote held-out quality benchmark
        run: python test_emote_heldout_quality.py
      - name: Run creator intelligence Phase 1 regressions
        run: python test_creator_intelligence_phase1.py
      - name: Run Phase 2 market intelligence Milestone 1 regressions
        run: python test_phase2_milestone1.py
      - name: Run Phase 2 creator discovery Milestone 2 regressions
        run: python test_phase2_milestone2.py
      - name: Run creator identity persistence regressions
        run: python test_creator_identity_persistence.py
      - name: Run Phase 2 Milestone 3 opportunity validation regressions
        run: python test_phase2_milestone3.py
      - name: Run Phase 2 Milestone 4 original concept regressions
        run: python test_phase2_milestone4.py
      - name: Run final certification regressions
        run: python test_final_certification.py
      - name: Run final command contract regressions
        run: python test_final_command_contracts.py
      - name: Run public command callback regressions
        run: python test_public_command_callbacks.py
      - name: Run safe Roblox API wrapper regressions
        run: python test_safe_roblox.py
      - name: Run sales source validation regressions
        run: python test_sales_source_validation.py
      - name: Run snapshot selection regressions
        run: python test_snapshot_batch.py
      - name: Run Astra and product understanding regressions
        run: |
          python test_astra.py
          python test_product_understanding.py
      - name: Run recommendation lifecycle regressions
        run: python test_recommendation_lifecycle.py
