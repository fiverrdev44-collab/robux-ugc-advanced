name: Survival Intelligence Tests

on:
  push:
    branches:
      - survival-intelligence
      - portfolio-change-intelligence
      - project-oracle-phase2-1
      - feat/accuracy-first-execution-policy
      - feature/emote-title-engine
      - fix/emote-title-live-defects
      - fix/emote-title-creative-quality
      - fix/emote-title-quality-calibration
      - fix/emote-title-production-acceptance
      - feat/creator-intelligence-phase1
  pull_request:
    branches:
      - main

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Project ORACLE regressions
        run: |
          python test_project_oracle.py
          python tests/test_oracle_worker.py
      - name: Run portfolio change watcher regressions
        run: |
          python test_rename_watcher.py
          python test_rename_tracking.py
      - name: Run survival intelligence regression tests
        run: python test_survival_intelligence.py
      - name: Run JARVIS and interpretation regressions
        run: python test_jarvis_cases.py
      - name: Run shared engine regressions
        run: python test_shared_repairs.py
      - name: Run convergence (hybrid) regressions
        run: python test_convergence_live.py
      - name: Run execution policy regressions
        run: python test_execution_policy.py
      - name: Run command cancellation integration tests
        run: python test_command_cancellation.py
      - name: Run emote title engine regressions
        run: python test_emote_title.py
      - name: Run emote quality evaluation set
        run: python test_emote_quality_set.py
      - name: Run emote held-out quality benchmark
        run: python test_emote_heldout_quality.py
      - name: Run creator intelligence Phase 1 regressions
        run: python test_creator_intelligence_phase1.py
      - name: Run Astra and product understanding regressions
        run: |
          python test_astra.py
          python test_product_understanding.py
      - name: Run recommendation lifecycle regressions
        run: python test_recommendation_lifecycle.py
