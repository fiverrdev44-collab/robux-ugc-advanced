name: Suggest Scraper

on:
  schedule:
    - cron: '30 4,10,16,22 * * *'
  workflow_dispatch:

concurrency:
  group: suggest
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run suggest scraper on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: 129.213.137.177
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 55m
          script: bash /home/ubuntu/robux-ugc-advanced/deploy/run_on_oracle.sh suggest.py
