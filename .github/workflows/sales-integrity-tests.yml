name: Sales Integrity Tests

on:
  push:
    branches:
      - fix/sales-integrity-repair
  pull_request:
    branches:
      - main

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sales integrity regressions
        run: python test_sales_integrity.py
      - name: Compile changed modules
        run: python -m py_compile sales_listener.py sales_reconciliation.py commands_sales.py post_monitor.py
