name: Backfill Dates

on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many items to process this run'
        required: false
        default: '3000'

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run date backfill on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: 129.213.137.177
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 110m
          script: bash /home/ubuntu/robux-ugc-advanced/deploy/run_on_oracle.sh backfill_dates.py BATCH_SIZE=${{ github.event.inputs.batch_size || '3000' }}
