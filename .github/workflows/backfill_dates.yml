name: Backfill Dates

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'How many items to process this run'
        required: false
        default: '2000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from backfill_dates import backfill
          backfill(int(os.getenv('BATCH_SIZE', '2000')))
          "
