name: Daily Enrichment

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Refresh top items on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: 129.213.137.177
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 110m
          script: bash /home/ubuntu/robux-ugc-advanced/deploy/run_on_oracle.sh enricher.py REFRESH_MODE=true
