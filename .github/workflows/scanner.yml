name: Daily Scanner

on:
  # Scheduled runs paused for VANTA 73 production migration.
  # Restore schedule after production validation.
  workflow_dispatch:

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run scanner on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: 129.213.137.177
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 110m
          script: bash /home/ubuntu/robux-ugc-advanced/deploy/run_on_oracle.sh scanner.py
