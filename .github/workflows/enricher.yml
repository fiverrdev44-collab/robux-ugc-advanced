name: Enricher

on:
  # Schedule disabled — the continuous ugc-enrich service on Server 2
  # handles enrichment. Running both doubled the API load and caused 429s.
  workflow_dispatch:

concurrency:
  group: enricher
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run enricher on Oracle
        uses: appleboy/ssh-action@master
        with:
          host: 129.213.137.177
          username: ubuntu
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 110m
          script: bash /home/ubuntu/robux-ugc-advanced/deploy/run_on_oracle.sh enricher.py
