name: Enricher

on:
  schedule:
    - cron: '30 2,8,14,20 * * *'
  workflow_dispatch:

concurrency:
  group: enricher
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run enricher
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROBLOSECURITY_COOKIE_1: ${{ secrets.ROBLOSECURITY_COOKIE_1 }}
          ROBLOSECURITY_COOKIE_2: ${{ secrets.ROBLOSECURITY_COOKIE_2 }}
          PYTHONUNBUFFERED: "1"
        run: python -u enricher.py
